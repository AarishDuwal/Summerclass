{% extends 'NewDesign/base.html' %}
{% load static %}

{% block title %}Sign up{% endblock %}

{% block content %}
<section class="section-content padding-y">
  <!-- ============================ COMPONENT REGISTER   ================================= -->
  <div class="card mx-auto" style="max-width: 520px; margin-top: 40px">
    <article class="card-body">
      <header class="mb-4"><h4 class="card-title">Sign up</h4></header>
      <form action="{% url 'accounts:register' %}" method="POST">
        {% csrf_token %}
        <div class="form-row">
          <div class="col form-group">
            <label>First name</label>
            <input type="text" name="first_name" maxlength="500" placeholder="Enter First Name" class="form-control" required id="id_first_name">
          </div>
          <!-- form-group end.// -->
          <div class="col form-group">
            <label>Last name</label>
            <input type="text" name="last_name" maxlength="500" placeholder="Enter Last Name" class="form-control" required id="id_last_name">
          </div>
          <!-- form-group end.// -->
        </div>
        <!-- form-row end.// -->
        <div class="form-row">
          <div class="form-group col-md-6">
            <label>Email Address</label>
            <input type="email" name="email" maxlength="100" placeholder="Enter Email Address" class="form-control" required id="id_email">
          </div>
          <!-- form-group end.// -->
          <div class="form-group col-md-6">
            <label>Phone Number</label>
            <input type="text" name="phone_number" maxlength="50" placeholder="Enter Phone Number" class="form-control" required id="id_phone_number">
          </div>
          <!-- form-group end.// -->
        </div>
        <!-- form-row.// -->
        <div class="form-row">
          <div class="form-group col-md-6">
            <label>Create password</label>
            <input type="password" name="password" placeholder="Enter Password" class="form-control" autocomplete="new-password" spellcheck="false" autocapitalize="off" autocorrect="off" inputmode="text" required id="id_password">
          </div>
          <!-- form-group end.// -->
          <div class="form-group col-md-6">
            <label>Repeat password</label>
            <input type="password" name="confirm_password" placeholder="Confirm Password" class="form-control" autocomplete="new-password" spellcheck="false" autocapitalize="off" autocorrect="off" inputmode="text" required id="id_confirm_password">
          </div>
          <!-- form-group end.// -->
        </div>
        <div class="form-group">
          <button type="submit" class="btn btn-primary btn-block">
            Register
          </button>
        </div>
        <!-- form-group// -->
      </form>
    </article>
    <!-- card-body.// -->
  </div>
  <!-- card .// -->
  <p class="text-center mt-4">
    Have an account? <a href="{% url 'accounts:login' %}">Log In</a>
  </p>
  <br /><br />
  <!-- ============================ COMPONENT REGISTER  END.// ================================= -->
</section>
{% endblock %}
