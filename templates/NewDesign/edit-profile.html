{% extends 'NewDesign/base.html' %}
{% load static %}

{% block title %}Edit Profile{% endblock %}

{% block content %}
<section class="section-content padding-y bg">
  <div class="container">
    <div class="row">
      <aside class="col-md-3">
        {% include 'NewDesign/_dashboard_sidebar.html' with active='edit_profile' %}
      </aside>
      <main class="col-md-9">
        <article class="card">
          <header class="card-header"><strong>Edit Profile</strong></header>
          <div class="card-body">
            <form method="post">
              {% csrf_token %}
              <div class="form-row">
                <div class="col form-group">
                  <label>First Name</label>
                  <input type="text" name="first_name" class="form-control" value="{{ user.first_name }}" required />
                </div>
                <div class="col form-group">
                  <label>Last Name</label>
                  <input type="text" name="last_name" class="form-control" value="{{ user.last_name }}" required />
                </div>
              </div>
              <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" class="form-control" value="{{ user.email }}" required />
              </div>
              <div class="form-group">
                <label>Phone Number</label>
                <input type="text" name="phone_number" class="form-control" value="{{ profile.phone_number }}" />
              </div>
              <button type="submit" class="btn btn-primary">Save Changes</button>
            </form>
          </div>
        </article>
      </main>
    </div>
  </div>
</section>
{% endblock %}
