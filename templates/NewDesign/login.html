{% extends 'NewDesign/base.html' %}
{% load static %}

{% block title %}Sign in{% endblock %}

{% block content %}
<section class="section-conten padding-y" style="min-height: 60vh">
  <!-- ============================ COMPONENT LOGIN   ================================= -->
  <div class="card mx-auto" style="max-width: 380px; margin-top: 60px">
    <div class="card-body">
      <h4 class="card-title mb-4">Sign in</h4>

      <form action="{% url 'accounts:login' %}" method="POST">
        {% csrf_token %}
        {% if request.GET.next %}
          <input type="hidden" name="next" value="{{ request.GET.next }}" />
        {% endif %}
        <div class="form-group">
          <input type="email" class="form-control" placeholder="Email Address" name="email" required />
        </div>
        <!-- form-group// -->
        <div class="form-group">
          <input type="password" class="form-control" name="password" placeholder="Password"
            autocomplete="current-password" spellcheck="false" autocapitalize="off" autocorrect="off"
            inputmode="text" required />
        </div>
        <!-- form-group// -->
        <div class="form-group">
          <button type="submit" class="btn btn-primary btn-block">Login</button>
        </div>
        <!-- form-group// -->
      </form>
    </div>
    <!-- card-body.// -->
  </div>
  <!-- card .// -->

  <p class="text-center mt-4">
    Don't have account? <a href="{% url 'accounts:register' %}">Sign up</a>
  </p>
  <br /><br />
  <!-- ============================ COMPONENT LOGIN  END.// ================================= -->
</section>
{% endblock %}
