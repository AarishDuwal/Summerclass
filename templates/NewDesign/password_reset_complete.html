{% extends 'NewDesign/base.html' %}
{% load static %}

{% block title %}Password Reset Complete{% endblock %}

{% block content %}
<section class="section-content padding-y">
  <div class="container">
    <div class="auth-split">
      <div class="auth-visual">
        <span class="hero-badge">✅ All set</span>
        <h2>Password updated.</h2>
        <p>You're good to go — sign in with your new password.</p>
      </div>
      <div class="auth-form-side">
        <div class="auth-form-inner text-center">
          <h4 class="card-title mb-3">Password updated</h4>
          <p class="text-muted">Your password has been changed successfully.</p>
          <a href="{% url 'accounts:login' %}" class="btn btn-primary">Sign in</a>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
