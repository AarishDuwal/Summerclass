{% extends "registration/base.html" %}
{% load i18n %}

{% block content %}
    <p class="login-box-msg">{% trans 'Please log in to see this page.' %}</p>

    <form action="" method="post">
        {% csrf_token %}
        {% if error %}
            <div class="callout callout-danger">
                <p>{{ error }}</p>
            </div>
        {% endif %}

        <div class="input-group mb-3">
            <input type="text" name="username" class="form-control" placeholder="{% trans 'Username' %}" autofocus required autocapitalize="none" />
            <div class="input-group-append">
                <div class="input-group-text"><span class="fas fa-user"></span></div>
            </div>
        </div>
        <div class="input-group mb-3">
            <input type="password" name="password" class="form-control" placeholder="{% trans 'Password' %}" required />
            <div class="input-group-append">
                <div class="input-group-text"><span class="fas fa-lock"></span></div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <button type="submit" class="btn btn-primary btn-block">{% trans 'Log in' %}</button>
            </div>
        </div>
    </form>
{% endblock %}
