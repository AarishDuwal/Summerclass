{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Islington Marketplace{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="{% static 'css/ui.css' %}" rel="stylesheet" type="text/css" />

    <style>
        body{ background:var(--paper); }

        .navbar{
            background:var(--ink) !important;
            border-bottom:3px solid var(--ink);
        }
        .navbar-brand{
            font-family:'Space Grotesk', sans-serif;
            font-weight:800;
            color:#fff !important;
            letter-spacing:-0.02em;
        }
        .navbar .nav-link{ color:#fff !important; font-weight:600; }
        .navbar .nav-link:hover{ color:var(--accent-2) !important; }

        .card{ border-radius:var(--radius-lg); }
        .card img{ height:250px; object-fit:cover; border-bottom:3px solid var(--ink); }

        .page-hero{
            background:var(--ink);
            color:#fff;
            padding:3rem 0;
            margin-bottom:2.5rem;
        }
        .page-hero h1{ color:#fff; margin:0; }

        footer.site-footer{
            margin-top:60px;
            padding:2rem 0;
            background:var(--ink);
            color:rgba(255,255,255,.75);
            text-align:center;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">

        <a class="navbar-brand" href="{% url 'home' %}">
            🛒 Islington Marketplace
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'home' %}">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'products' %}">Products</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'blogs' %}">Blogs</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/admin/">Admin</a>
                </li>

            </ul>

        </div>

    </div>
</nav>

<div class="container py-5">
    {% block content %}
    {% endblock %}
</div>

<footer class="site-footer">
    &copy; 2026 Islington Marketplace
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

{% block extra_js %}{% endblock %}

</body>
</html>
